name: Build APK from Compressed File
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install p7zip
        run: sudo apt-get install p7zip-full -y

      - name: Extract Project
        run: |
          ZIP_FILE=$(find . -name "*.7z" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .7z file found!"
            exit 1
          fi
          7z x "$ZIP_FILE"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build with Gradle
        run: |
          find . -name "gradlew" -exec chmod +x {} \;
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          cd $(dirname $GRADLE_PATH) && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/*.apk"
